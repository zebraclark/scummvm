name: Build M2 CN

on:
  workflow_dispatch:
  push:
    branches: [m2-cn-patch]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout ScummVM master
        uses: actions/checkout@v4
        with:
          repository: scummvm/scummvm
          ref: master
          path: scummvm-src

      - name: Apply M2 patch
        shell: bash
        run: |
          cd scummvm-src
          curl -fsSL https://raw.githubusercontent.com/zebraclark/scummvm/m2-cn-patch/.github/workflows/build-m2.yml -o /tmp/check.yml || true
          mkdir -p engines/lastexpress/sound
          curl -fsSL https://raw.githubusercontent.com/zebraclark/scummvm/m2-cn-patch/engines/lastexpress/sound/subtitle.h -o engines/lastexpress/sound/subtitle.h
          curl -fsSL https://raw.githubusercontent.com/zebraclark/scummvm/m2-cn-patch/engines/lastexpress/sound/subtitle.cpp -o engines/lastexpress/sound/subtitle.cpp
          echo "=== files applied ==="
          ls -la engines/lastexpress/sound/subtitle.*

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-freetype
            make

      - name: Configure
        shell: msys2 {0}
        run: |
          cd scummvm-src
          ./configure --host=x86_64-w64-mingw32 --enable-freetype2 2>&1 | tail -50

      - name: Build
        shell: msys2 {0}
        run: |
          cd scummvm-src
          make -j2

      - name: Package
        shell: msys2 {0}
        run: |
          cd scummvm-src
          cp scummvm.exe ../scummvm.exe
          cd ..
          7z a scummvm-m2cn.zip scummvm.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scummvm-m2cn
          path: scummvm-m2cn.zip
